name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.HERALD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/herald.jks"
            echo "HERALD_KEYSTORE_PATH=$RUNNER_TEMP/herald.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          HERALD_KEYSTORE_PASSWORD: ${{ secrets.HERALD_KEYSTORE_PASSWORD }}
          HERALD_KEY_ALIAS: ${{ secrets.HERALD_KEY_ALIAS }}
          HERALD_KEY_PASSWORD: ${{ secrets.HERALD_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --console=plain

      - name: Warn when unsigned
        if: github.event_name != 'pull_request' && env.HERALD_KEYSTORE_PATH == ''
        run: echo "::warning::Signing secrets missing. APK built with a temporary key and no release was published."

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Herald.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Herald-apk
          path: Herald.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HERALD_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Herald.apk --title "Herald $TAG" --notes "Built from ${GITHUB_SHA::7}. Install Herald.apk on your phone." --latest
